global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-gateway
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/api.json

  - job_name: coordinator
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/coordinator.json

  - job_name: worker
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/worker.json

  - job_name: rabbitmq
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/rabbitmq.json

  - job_name: patroni
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/patroni.json

  - job_name: haproxy
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/haproxy.json

  - job_name: pgbouncer
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pgbouncer.json

  - job_name: redis
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/redis.json
