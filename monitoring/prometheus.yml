global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: /metrics

  - job_name: coordinator
    static_configs:
      - targets: ['coordinator:9090']
    metrics_path: /metrics

  - job_name: worker
    static_configs:
      - targets:
          - 'worker-1:9100'
          - 'worker-2:9100'
          - 'worker-3:9100'
    metrics_path: /metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
