openapi: 3.0.3
info:
  title: Distributed Task Scheduler API
  description: REST API for scheduling one-time and recurring tasks across worker nodes.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        task_name:
          type: string
        command_payload:
          type: object
          example: { "command": "echo hello" }
        schedule_type:
          type: string
          enum: [one-time, recurring]
        cron_expression:
          type: string
          nullable: true
          description: Required for recurring (e.g. "0 * * * *" every hour)
        next_execution_time:
          type: string
          format: date-time
          description: Base cron slot or user-requested one-time time. Never jittered.
        dispatch_at:
          type: string
          format: date-time
          description: Effective dispatch time (next_execution_time plus stable jitter).
        jitter_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Maximum stable jitter window.
        jitter_policy:
          type: string
          enum: [none, stable]
          description: none forces jitter_seconds to zero.
        status:
          type: string
          enum: [pending, scheduled, running, completed, failed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        worker_id:
          type: string
          nullable: true
        scheduled_for:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, running, completed, failed, timeout, cancelled]
        output:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        lease_id:
          type: string
          format: uuid
          nullable: true
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        attempt:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    ExecutionAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        worker_id:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, completed, failed, timeout, cancelled]
        error_message:
          type: string
          nullable: true
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /tasks:
    get:
      summary: List user's tasks (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '401':
          description: Unauthorized
    post:
      summary: Create a new task
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional durable key (1-255 characters). Replaying the same
            key and request body returns the original response without creating a
            second task. Reusing a key with a different body returns 409.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_name, command_payload, schedule_type]
              properties:
                task_name:
                  type: string
                  maxLength: 255
                command_payload:
                  type: object
                  example: { "command": "echo hello" }
                schedule_type:
                  type: string
                  enum: [one-time, recurring]
                cron_expression:
                  type: string
                  nullable: true
                next_execution_time:
                  type: string
                  format: date-time
                  description: Required for one-time. Recurring tasks are anchored
                    to the next cron occurrence.
                jitter_seconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
                jitter_policy:
                  type: string
                  enum: [none, stable]
      responses:
        '201':
          description: Task created, or the stored response replayed for an
            Idempotency-Key
          headers:
            Idempotent-Replayed:
              description: Present and true when this response came from a stored
                idempotency record.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Idempotency-Key is in progress or was reused with a different
            request body

  /tasks/{id}:
    get:
      summary: Get task details
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    put:
      summary: Update task
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_name:
                  type: string
                command_payload:
                  type: object
                schedule_type:
                  type: string
                  enum: [one-time, recurring]
                cron_expression:
                  type: string
                  nullable: true
                next_execution_time:
                  type: string
                  format: date-time
                jitter_seconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
                jitter_policy:
                  type: string
                  enum: [none, stable]
                status:
                  type: string
                  enum: [pending, scheduled, cancelled]
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    delete:
      summary: Delete task
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /tasks/{id}/executions:
    get:
      summary: Get task execution history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskExecution'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /tasks/{id}/executions/{executionId}/attempts:
    get:
      summary: Get attempt history for one execution
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Attempts ordered by attempt number
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExecutionAttempt'
        '401':
          description: Unauthorized
        '404':
          description: Execution not found
