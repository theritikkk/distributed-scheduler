; Disposable PgBouncer config for tests/pgbouncer/run.sh.
;
; It mirrors deploy/ha-lab/ha/pgbouncer.ini.tmpl: SCRAM auth, transaction
; pooling, two server connections, and DISCARD ALL after every transaction.
; The small pool makes connection reuse and session-reset behavior observable.
[databases]
distributed_scheduler = host=postgres port=5432 dbname=distributed_scheduler

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 100
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 0
max_db_connections = 4

server_reset_query = DISCARD ALL
server_reset_query_always = 1
server_idle_timeout = 60
server_lifetime = 3600
server_connect_timeout = 5
server_login_retry = 2

client_login_timeout = 10
client_idle_timeout = 60
query_wait_timeout = 10
ignore_startup_parameters = extra_float_digits

admin_users = postgres
stats_users = scheduler

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 5
