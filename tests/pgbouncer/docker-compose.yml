name: scheduler-pgbouncer-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "56432:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U scheduler -d distributed_scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - "59127:9127"
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://scheduler:scheduler_secret@pgbouncer:6432/pgbouncer?sslmode=disable
