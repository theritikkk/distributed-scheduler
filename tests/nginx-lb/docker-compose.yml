name: scheduler-nginx-lb-test

services:
  backend1:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:8080", "-text=backend-1"]

  backend2:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:8080", "-text=backend-2"]

  backend3:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:8080", "-text=backend-3"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "18081:8081"
    volumes:
      - ./runtime/nginx.conf:/etc/nginx/nginx.conf:ro
