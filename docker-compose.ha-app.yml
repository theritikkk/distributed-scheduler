# Application services for the three-node HA lab.
#
# Data services are started from docker-compose.ha-data.yml first. This file
# runs one API, one coordinator, and three workers on every node. Monitoring
# runs only on node1 with:
#   docker compose -f docker-compose.ha-app.yml --profile monitoring up -d
name: scheduler-ha-app

x-app-host: &app-host
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    <<: *app-host

  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      APP_ENV: production
    <<: *app-host

  worker-1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-1
    restart: unless-stopped
    ports:
      - "9101:9100"
    env_file:
      - .env
    environment:
      APP_ENV: production
      WORKER_ID: ${NODE_NAME}-worker-1
      METRICS_PORT: "9100"
    <<: *app-host

  worker-2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-2
    restart: unless-stopped
    ports:
      - "9102:9100"
    env_file:
      - .env
    environment:
      APP_ENV: production
      WORKER_ID: ${NODE_NAME}-worker-2
      METRICS_PORT: "9100"
    <<: *app-host

  worker-3:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-3
    restart: unless-stopped
    ports:
      - "9103:9100"
    env_file:
      - .env
    environment:
      APP_ENV: production
      WORKER_ID: ${NODE_NAME}-worker-3
      METRICS_PORT: "9100"
    <<: *app-host

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.ha.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    profiles: ["monitoring"]
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
